<!DOCTYPE html>
<html lang="es" data-theme="light" data-letra="manuscrita">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>CuadernU · Pizarra del profesor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Cpath d='M8 22l3-10 5 7 4-11 4 14' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles/tutor.css">
</head>
<body data-vista="inicio">
  <header class="barra" aria-label="Barra superior">
    <button type="button" id="btn-inicio" class="btn-icono" aria-label="Volver al inicio" title="Inicio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 3 10.6V21h6.2v-6.2h5.6V21H21V10.6L12 3.2Z"/></svg>
    </button>
    <div class="barra-titulo">
      <strong id="titulo">Pizarra del profesor</strong>
      <span id="subtitulo-barra"></span>
    </div>
    <div id="progreso" class="progreso" hidden>
      <span id="progreso-txt" class="progreso-txt"></span>
      <div id="progreso-puntos" class="progreso-puntos" role="group" aria-label="Pasos de la lección"></div>
    </div>
    <div class="barra-fin">
      <span class="estado" id="estado" role="status"><span class="punto" id="punto" aria-hidden="true"></span><span id="estado-txt">Conectando</span></span>
      <button type="button" id="btn-enfoque" class="btn-icono" aria-pressed="false" aria-label="Modo enfoque" title="Modo enfoque (F)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5v2H6v3H4Zm11-5h5v5h-2V6h-3V4ZM4 15h2v3h3v2H4v-5Zm14 0h2v5h-5v-2h3v-3Z"/></svg>
      </button>
      <button type="button" id="btn-ajustes" class="btn-icono" popovertarget="ajustes" aria-label="Ajustes" title="Voz, letra y tema">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9.2a3 3 0 0 1 5.6 0H20v2h-1.2a3 3 0 0 1-5.6 0H4V6Zm0 10h1.2a3 3 0 0 1 5.6 0H20v2h-9.2a3 3 0 0 1-5.6 0H4v-2Z"/></svg>
      </button>
    </div>
  </header>

  <main class="escena" id="escena">
    <section id="vista-inicio" class="vista" aria-label="Inicio"></section>
    <section id="vista-biblioteca" class="vista" aria-label="Banco de ejercicios" hidden></section>
    <section id="vista-formulario" class="vista" aria-label="Estudio del formulario oficial" hidden></section>

    <section id="vista-pizarra" class="vista vista-pizarra" aria-label="Pizarra" hidden>
      <div id="tablero" class="tablero" tabindex="0" aria-label="Hoja de la pizarra">
        <div id="hoja" class="hoja">
          <div id="columna" class="columna"></div>
          <div id="material" class="material" hidden></div>
          <svg id="capa-marcas" class="capa capa-marcas" aria-hidden="true"></svg>
          <svg id="capa-lapiz" class="capa capa-lapiz" aria-hidden="true"></svg>
        </div>
      </div>
      <div class="herramientas" role="toolbar" aria-label="Herramientas" aria-orientation="vertical">
        <button type="button" class="herr" data-herr="puntero" aria-pressed="true" title="Puntero: toca un símbolo para preguntar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 9-6.2 1.7L10 20 5 3Z"/></svg><span>Puntero</span>
        </button>
        <button type="button" class="herr" data-herr="encerrar" aria-pressed="false" title="Encerrar: rodea lo que no entendiste">
          <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="11" rx="8.5" ry="6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/></svg><span>Encerrar</span>
        </button>
        <button type="button" class="herr" data-herr="lapiz" aria-pressed="false" title="Lápiz: escribe encima">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25Zm17.71-10.21a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83Z"/></svg><span>Lápiz</span>
        </button>
        <div id="colores-lapiz" class="colores" role="group" aria-label="Color del lápiz" hidden>
          <button type="button" data-color="azul" aria-pressed="true" aria-label="Azul"></button>
          <button type="button" data-color="rojo" aria-pressed="false" aria-label="Rojo"></button>
          <button type="button" data-color="verde" aria-pressed="false" aria-label="Verde"></button>
          <button type="button" data-color="tinta" aria-pressed="false" aria-label="Tinta"></button>
        </div>
        <button type="button" id="btn-borrar-lapiz" class="herr" title="Borrar mis trazos" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16.2 3.6 5 4.9c.8.8.8 2 0 2.8l-9.2 9.2a2 2 0 0 1-1.4.6H5.8a2 2 0 0 1-1.4-.6l-1.6-1.6a2 2 0 0 1 0-2.8L13.4 3.6a2 2 0 0 1 2.8 0ZM6.5 19.1h3.7l2.8-2.8-5.7-5.7-2.8 2.8 2 5.7Z"/></svg><span>Borrar</span>
        </button>
        <span class="herr-sep" aria-hidden="true"></span>
        <button type="button" id="btn-menos" class="herr" title="Letra más pequeña (Ctrl −)" aria-label="Letra más pequeña"><b>A−</b></button>
        <button type="button" id="btn-mas" class="herr" title="Letra más grande (Ctrl +)" aria-label="Letra más grande"><b>A+</b></button>
      </div>
      <button type="button" id="btn-volver" class="volver" hidden>Volver a lo que se está explicando</button>
      <aside id="lateral" class="lateral" aria-label="Apoyo visual" hidden>
        <div class="lateral-tabs" role="tablist" aria-label="Apoyo">
          <button type="button" role="tab" data-tab="visual" aria-selected="true">Visual</button>
          <button type="button" role="tab" data-tab="enunciado" aria-selected="false" tabindex="-1">Enunciado</button>
          <button type="button" role="tab" data-tab="formulas" aria-selected="false" tabindex="-1">Fórmulas</button>
        </div>
        <div id="panel-visual" class="lateral-panel" role="tabpanel"></div>
        <div id="panel-enunciado" class="lateral-panel" role="tabpanel" hidden></div>
        <div id="panel-formulas" class="lateral-panel" role="tabpanel" hidden></div>
      </aside>
    </section>
  </main>

  <footer class="consola" id="consola">
    <div id="subtitulo" class="subtitulo" hidden aria-live="off">
      <span id="subtitulo-quien" class="subtitulo-quien">Profesor</span>
      <p id="subtitulo-txt" class="subtitulo-txt"></p>
    </div>

    <div id="transporte" class="transporte" hidden>
      <div class="trans-izq">
        <button type="button" id="btn-anterior" class="btn" title="Paso anterior (←)" aria-label="Paso anterior">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5 8 12l7.5 7 1.4-1.5L11 12l5.9-5.5L15.5 5Z"/></svg>
        </button>
        <button type="button" id="btn-repetir" class="btn" title="Repetir este paso (R)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1.8L7 6.5l5 4.7V7.5a5 5 0 1 1-5 5H4.5A7.5 7.5 0 1 0 12 5Z"/></svg><span>Repetir</span>
        </button>
        <button type="button" id="btn-pausa" class="btn btn-fuerte" title="Pausa o continuar (Espacio)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path id="ico-pausa" d="M7 5h3.5v14H7V5Zm6.5 0H17v14h-3.5V5Z"/></svg><span id="txt-pausa">Pausa</span>
        </button>
        <button type="button" id="btn-siguiente" class="btn btn-principal" title="Siguiente paso (→)">
          <span id="txt-siguiente">Siguiente</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8.5 5 7.5 7-7.5 7-1.4-1.5L13 12 7.1 6.5 8.5 5Z"/></svg>
        </button>
      </div>
      <div class="trans-der">
        <button type="button" id="btn-despacio" class="btn btn-suave" title="Abrir los pasos intermedios">Más despacio</button>
        <button type="button" id="btn-origen" class="btn btn-suave" title="De dónde sale cada cosa">¿De dónde salió?</button>
        <button type="button" id="btn-porque" class="btn btn-suave" title="La razón de este paso">¿Por qué?</button>
      </div>
    </div>

    <div class="preguntar">
      <button type="button" id="btn-mic" class="btn btn-mic" aria-pressed="false" title="Hablar en vivo con el profesor">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-3.07A7 7 0 0 0 19 11h-2Z"/></svg>
        <span>Hablar</span><i id="nivel-mic" class="nivel-mic" aria-hidden="true"></i>
      </button>
      <input id="pregunta" type="text" placeholder="Pregunta algo, escribe “ejercicio 16” o “Q049”, o pega una imagen (Ctrl+V)" autocomplete="off" aria-label="Pregunta al profesor">
      <button type="button" id="btn-enviar" class="btn btn-principal">Enviar</button>
      <button type="button" id="btn-adjuntar" class="btn" title="Abrir PDF o imagen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Zm0 2.5L17.5 8H14V4.5Z"/></svg><span>Abrir</span>
      </button>
    </div>
  </footer>

  <div id="menu-seleccion" class="flotante" hidden role="dialog" aria-label="Qué hacer con lo seleccionado">
    <div class="flotante-tit" id="sel-titulo"></div>
    <div class="flotante-acc">
      <button type="button" data-sel="origen">¿De dónde salió?</button>
      <button type="button" data-sel="cero">Explícamelo desde cero</button>
      <button type="button" data-sel="despacio">Con más pasos</button>
    </div>
    <div class="flotante-fila"><input id="sel-pregunta" type="text" placeholder="Pregunta sobre esto" autocomplete="off" aria-label="Pregunta sobre lo seleccionado"><button type="button" id="sel-enviar" class="btn btn-principal">Preguntar</button></div>
  </div>

  <div id="ajustes" popover="auto" class="hoja-ajustes" aria-label="Ajustes"></div>

  <dialog id="visor" class="visor" aria-label="Imagen ampliada"><img id="visor-img" alt=""><button type="button" id="visor-cerrar" class="btn">Cerrar</button></dialog>

  <input id="archivo" type="file" accept="application/pdf,image/png,image/jpeg,image/webp,.zip" hidden>
  <div id="avisos" class="avisos" aria-live="polite"></div>
  <p id="lector" class="solo-lector" role="status"></p>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
