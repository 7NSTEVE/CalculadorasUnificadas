name: Monorepo CI (Hygiene + Core/FFI Linux + iOS CuadernU)

on:
  push:
    branches: [ main, "feat/**", "fix/**", "consolidation/**" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Workspace Hygiene Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run workspace hygiene validator
        run: python3 tools/check_workspace_hygiene.py

  core-linux:
    name: Core v47 + CuadernU Studio FFI (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zlib development headers
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Configure core & CuadernU Studio FFI tests
        run: |
          cmake -S core -B build/core-linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CORE_TESTS=ON \
            -DCUADERNU_BUILD_STUDIO_FFI=ON
      - name: Build core & Studio FFI tests
        run: cmake --build build/core-linux --parallel "$(nproc)"
      - name: Unpack CG50 warm state for live CTest
        run: gunzip -k -f assets/roms/cg50_warm_state.bin.gz
      - name: Run CTest
        run: ctest --test-dir build/core-linux --output-on-failure

  ios-xcframework:
    name: iOS CasioNativeCore + Studio FFI XCFramework (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build CasioNativeCore.xcframework
        run: |
          chmod +x tools/build_ios_xcframework.sh
          ./tools/build_ios_xcframework.sh
      - name: Verify XCFramework slices
        run: ls -la build/ios-xcframework/CasioNativeCore.xcframework

  ios-cuadernu-app:
    name: iOS / iPadOS CuadernU Swift + Metal + C++20 Build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate CuadernU.xcodeproj
        working-directory: apps/ios_native
        run: xcodegen generate
      - name: Build & Run CuadernU 4-Calculator + Studio FFI tests + Live iPadOS Screenshots
        working-directory: apps/ios_native
        run: |
          SHOTS_DIR="${RUNNER_TEMP}/ipados_screenshots"
          mkdir -p "${SHOTS_DIR}"
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; cands=[x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x.get('isAvailable') and 'iPad' in x.get('name','')]; print(cands[0] if cands else '')")"
          if [ -z "${SIM_ID}" ]; then
            SIM_ID="$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; cands=[x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x.get('isAvailable')]; print(cands[0] if cands else '')")"
          fi
          echo "Using iOS Simulator UDID: ${SIM_ID}"
          TEST_RUNNER_CUADERNU_SHOTS_DIR="${SHOTS_DIR}" \
          xcodebuild \
            -project CuadernU.xcodeproj \
            -scheme CuadernU \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${SIM_ID}" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test -only-testing:CuadernUTests
          ls -lh "${SHOTS_DIR}"
      - name: Upload live iPadOS Simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipados-cuadernu-screenshots
          path: ${{ runner.temp }}/ipados_screenshots/*.png
          if-no-files-found: warn
      - name: Package unsigned CuadernU iPadOS/iOS IPA (for Sideloadly / 3uTools / AltStore)
        working-directory: apps/ios_native
        run: |
          xcodebuild \
            -project CuadernU.xcodeproj \
            -scheme CuadernU \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${RUNNER_TEMP}/dd_ios_device" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p "${RUNNER_TEMP}/ipa_stage/Payload"
          cp -R "${RUNNER_TEMP}/dd_ios_device/Build/Products/Debug-iphoneos/CuadernU.app" "${RUNNER_TEMP}/ipa_stage/Payload/"
          (cd "${RUNNER_TEMP}/ipa_stage" && zip -qry "${RUNNER_TEMP}/CuadernU-iPadOS-unsigned.ipa" Payload)
          ls -lh "${RUNNER_TEMP}/CuadernU-iPadOS-unsigned.ipa"
      - name: Upload unsigned CuadernU iPadOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: cuadernu-ipados-unsigned-ipa
          path: ${{ runner.temp }}/CuadernU-iPadOS-unsigned.ipa
