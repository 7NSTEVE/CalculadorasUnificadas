<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios TEC - Visualizador & Monitoreo de Cupos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main-container">
        <header>
            <div class="header-content">
                <h1>Visualizador & Monitoreo de Cupos</h1>
                <p class="subtitle">Encontrando la mejor combinación para tus mañanas</p>
            </div>
            <div class="stats-badge">
                <span id="score-display">Puntaje: 0</span>
            </div>
        </header>

        <!-- Monitoreo de Cupos Panel -->
        <section class="live-monitor-bar">
            <div class="monitor-controls">
                <button id="refresh-seats-btn" class="action-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.13 15.57a10 10 0 1 0 4-13.84L2.5 6"></path></svg>
                    Verificar Cupos
                </button>
                <label class="toggle-container">
                    <input type="checkbox" id="auto-refresh-toggle">
                    <span class="toggle-slider"></span>
                    <span class="toggle-label">Monitoreo Auto (30s)</span>
                </label>
            </div>
            <div class="monitor-status">
                <span class="pulse-dot"></span>
                <span id="last-update-text">Cupos actualizados</span>
            </div>
        </section>

        <section class="controls">
            <button id="prev-btn" class="nav-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                Anterior
            </button>
            <div class="combo-indicator">
                Horario <span id="current-idx">1</span> de <span id="total-combos">0</span>
            </div>
            <button id="next-btn" class="nav-btn">
                Siguiente
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </section>

        <section class="course-legend" id="course-legend">
            <!-- Dynamic course badges injected via JS -->
        </section>

        <section class="calendar-container">
            <div class="calendar-grid" id="calendar-grid">
                <!-- Grid injected via JS -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
